<div class="max-w-2xl mx-auto py-12 px-6 flex flex-col gap-6">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
    <h1 class="text-2xl font-semibold">Liste des utilisateurs</h1>
    <a mat-raised-button color="primary" routerLink="/users/add" class="w-fit">
      Ajouter un utilisateur
    </a>
  </div>

  @if (loading) {
    <div class="flex justify-center py-28">
      <mat-spinner diameter="40" />
    </div>
  } @else if (errorMessage) {
    <p class="text-red-600">{{ errorMessage }}</p>
  } @else {
    <table
      mat-table
      [dataSource]="users"
      matSort
      matSortDisableClear
      (matSortChange)="onSortChange($event)"
      class="w-full"
    >
      <ng-container matColumnDef="firstName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Prénom</th>
        <td mat-cell *matCellDef="let user">{{ user.firstName }}</td>
      </ng-container>

      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
        <td mat-cell *matCellDef="let user">{{ user.lastName }}</td>
      </ng-container>

      <ng-container matColumnDef="empty">
        <td
          mat-footer-cell
          *matFooterCellDef
          [attr.colspan]="displayedColumns.length"
          class="!text-center text-gray-600 !py-6"
        >
          Aucun utilisateur.
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr
        mat-footer-row
        *matFooterRowDef="['empty']"
        [hidden]="users.length > 0"
      ></tr>
    </table>
  }
</div>
