services:
  nest:
    build:
      dockerfile: .docker/nest/Dockerfile
    restart: unless-stopped
    ports:
      - ${NEST_PORT}:3000
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: pass
      DB_NAME: postgres
    volumes:
      - ./nest:/home/node/app
    depends_on:
      - db
    networks:
      - myDiabby

  db:
    image: postgres:16.1-alpine3.19
    restart: always
    ports:
      - ${DB_PORT}:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: postgres
    networks:
      - myDiabby

  angular:
    build:
      dockerfile: .docker/angular/Dockerfile
    container_name: angular
    restart: unless-stopped
    ports:
      - ${NG_PORT}:4200
    volumes:
      - ./angular:/home/node/app
    networks:
      - myDiabby

networks:
    myDiabby:
        driver: bridge